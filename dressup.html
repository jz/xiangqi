  sheer:{sh:40, sp:0.16}, fur:{sh:8, sp:0.03}
};
const itemById = id => ITEMS.find(i=>i.id===id);

function newWorn(item){
  return {
    id:item.id,
    color:item.color,
    color2:item.color2 || shade(item.color,-0.42),
    pattern:item.pattern || 'none',
    patScale:3,
    adj:{sx:1,sy:1,sz:1,ox:0,oy:0,oz:0,ry:0},
    tex:null
  };
}

/* ── scene graph ──────────────────────────────────────────────────── */
const rig = new Rig();
let PROFILE = buildProfile(S.body);

const scene = {
  body:[], hair:[], stage:[],
  slot:{}   // slot → [DrawObj]
};
for(const s of SLOTS) scene.slot[s]=[];

const faceTex = new DynTex(512, false);
const hairTex = new DynTex(256, true);

function disposeObjs(list){ for(const o of list) o.mesh.dispose(); list.length=0; }

/* materials */
function matFor(part, worn, item){
  const fab = FABRIC[item&&item.fabric] || FABRIC.cotton;
  const kind = part.mat || 'main';
  let color, tex=null, repeat=[1,1];
  if(kind==='alt') color = worn? worn.color2 : '#333';
  else if(kind==='dark') color = '#141319';
  else if(kind==='skin') color = S.skin;
  else {
    color = worn? worn.color : (item&&item.color) || '#CCC';
    if(worn && worn.pattern!=='none' && worn.tex){
      tex = worn.tex.tex;
      const k = worn.patScale;
      repeat = [k, k];
    }
  }
  return {
    color: hex2rgb(color),
    tex, repeat,
    sh: part.sh!==undefined? part.sh : fab.sh,
    sp: part.sp!==undefined? part.sp : fab.sp,
    alpha: part.alpha!==undefined? part.alpha : (item&&item.alpha!==undefined? item.alpha : 1),
    emis: part.emis!==undefined? part.emis : (item&&item.glow? item.glow : 0),
    wrap: 0.35
  };
}
function mkObjs(parts, worn, item){
  return parts.map(p=>({
    mesh: new Mesh(p.geo),
    node: p.node || 'spine',
    mat: matFor(p, worn, item),
    worn, item, part:p
  }));
}

/* ── builders ─────────────────────────────────────────────────────── */
function refreshFace(){
  drawFace(faceTex.ctx, S);
  faceTex.upload();
}
function refreshHair(){
  drawHair(hairTex.ctx, hairTex.size, S.hair.root, S.hair.tip, S.hair.gloss);
  hairTex.upload();
}
function refreshPattern(slot){
  const w = S.worn[slot]; if(!w) return;
  if(w.pattern==='none'){
    if(w.tex){ w.tex.dispose(); w.tex=null; }
  } else {
    if(!w.tex) w.tex = new DynTex(256, true);
    drawPattern(w.tex.ctx, 256, w.pattern, w.color, w.color2);
    w.tex.upload();
  }
  for(const o of scene.slot[slot]) o.mat = matFor(o.part, w, itemById(w.id));
}

function buildBodyObjs(){
  disposeObjs(scene.body);
  const parts = buildBody(PROFILE, S);
  for(const p of parts){
    const isFace = p.mat==='face';
    scene.body.push({
      mesh:new Mesh(p.geo), node:p.node,
      mat:{color:hex2rgb(S.skin), tex:isFace? faceTex.tex : null, repeat:[1,1],
           sh:26, sp:0.14+S.glow*0.22, alpha:1, emis:0, wrap:0.55},
      part:p
    });
  }
}
function buildHairObjs(){
  disposeObjs(scene.hair);
  const style = HAIRSTYLES.find(h=>h.id===S.hair.style);
  const geos = style? style.build() : [];
  if(S.hair.bangs!=='none') geos.push(bangs(S.hair.bangs));
  for(const g of geos){
    if(!g || !g.idx.length) continue;
    scene.hair.push({
      mesh:new Mesh(g), node:'head',
      mat:{color:[1,1,1], tex:hairTex.tex, repeat:[1,1], sh:44, sp:0.30,
           alpha:1, emis:0, wrap:0.45},
      part:{}
    });
  }
}
function buildSlot(slot){
  disposeObjs(scene.slot[slot]);
  const w = S.worn[slot];
  if(!w) return;
  const item = itemById(w.id);
  if(!item) return;
  const parts = item.build(PROFILE, S, item) || [];
  scene.slot[slot] = mkObjs(parts.filter(p=>p.geo && p.geo.idx.length), w, item);
}
function rebuildAll(){
  PROFILE = buildProfile(S.body);
  buildBodyObjs();
  buildHairObjs();
  for(const s of SLOTS) buildSlot(s);
  applyShoeLift();
}
/* heels raise the whole figure and point the toes */
function applyShoeLift(){
  const w = S.worn.shoes;
  const item = w && itemById(w.id);
  const lift = item && item.lift;
  rig.nodes.root.p[1] = lift? lift.h : 0;
  const ang = lift? lift.ang : 0;
  rig.nodes.footL.bind[0] = ang;
  rig.nodes.footR.bind[0] = ang;
}

function equip(slot, id){
  const cur = S.worn[slot];
  if(cur && cur.id===id){        // tap again to take it off
    if(cur.tex) cur.tex.dispose();
    S.worn[slot]=null;
  } else {
    if(cur && cur.tex) cur.tex.dispose();
    const item = itemById(id);
    S.worn[slot] = newWorn(item);
    if(slot==='dress'){ clearSlot('top'); clearSlot('bottom'); }
    if(slot==='top'||slot==='bottom') clearSlot('dress');
    refreshPattern(slot);
  }
  buildSlot(slot);
  if(slot==='shoes') applyShoeLift();
}
function clearSlot(slot){
  const cur=S.worn[slot];
  if(cur && cur.tex) cur.tex.dispose();
  S.worn[slot]=null;
  buildSlot(slot);
  if(slot==='shoes') applyShoeLift();
}

/* ── stage ────────────────────────────────────────────────────────── */
const BACKDROPS = {
  studio:  {top:'#2A2333', bot:'#141119', pool:'#4A3F58', key:'#FFF1E2', fill:'#8E7FB8', rim:'#FF4D8D'},
  sunset:  {top:'#7A3A5C', bot:'#241426', pool:'#8A4A5E', key:'#FFD9A8', fill:'#B06A9A', rim:'#FF8A5B'},
  neon:    {top:'#161036', bot:'#08060F', pool:'#2A1A5C', key:'#C8B4FF', fill:'#3AE0E0', rim:'#FF3D9A'},
  garden:  {top:'#2E4232', bot:'#12180F', pool:'#3E5A3A', key:'#FFF6DC', fill:'#9FD08A', rim:'#F5D06B'},
  ice:     {top:'#1E3348', bot:'#0B131C', pool:'#2E4C68', key:'#EAF6FF', fill:'#7FB6E0', rim:'#B8E0FF'}
};
let bgKey = 'studio';
const bgTex = new DynTex(64, false);
const floorTex = new DynTex(256, false);
const shadowTex = new DynTex(128, false);

function paintStage(){
  const B = BACKDROPS[bgKey];
  let c = bgTex.ctx;
  let g = c.createLinearGradient(0,0,0,64);
  g.addColorStop(0, B.bot); g.addColorStop(0.42, mixHex(B.bot,B.top,0.55)); g.addColorStop(1, B.top);
  c.fillStyle=g; c.fillRect(0,0,64,64);
  bgTex.upload();

  c = floorTex.ctx;
  c.fillStyle = B.bot; c.fillRect(0,0,256,256);
  const rg = c.createRadialGradient(128,128,4,128,128,128);
  rg.addColorStop(0, shade(B.pool,0.22));
  rg.addColorStop(0.28, B.pool);
  rg.addColorStop(0.55, mixHex(B.pool,B.bot,0.6));
  rg.addColorStop(1, B.bot);
  c.fillStyle=rg; c.fillRect(0,0,256,256);
  floorTex.upload();

  c = shadowTex.ctx;
  c.clearRect(0,0,128,128);
  const sg = c.createRadialGradient(64,64,2,64,64,64);
  sg.addColorStop(0,'rgba(0,0,0,0.55)'); sg.addColorStop(0.34,'rgba(0,0,0,0.30)');
  sg.addColorStop(0.66,'rgba(0,0,0,0.09)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=sg; c.fillRect(0,0,128,128);
  shadowTex.upload();
}
function buildStage(){
  disposeObjs(scene.stage);
  const cyc = revolve([
    {y:-0.6, rx:7.0, rz:7.0},{y:1.2, rx:7.0, rz:7.0},
    {y:3.6, rx:6.6, rz:6.6},{y:5.4, rx:4.4, rz:4.4}
  ],{seg:40});
  scene.stage.push({mesh:new Mesh(cyc), node:'world',
    mat:{color:[1,1,1], tex:bgTex.tex, repeat:[1,1], sh:1, sp:0, alpha:1, emis:1.15, wrap:1, rim:0}, part:{}});
  const fl = disc(6.5, 56, 0.0);
  scene.stage.push({mesh:new Mesh(fl), node:'world',
    mat:{color:[1,1,1], tex:floorTex.tex, repeat:[1,1], sh:6, sp:0.05, alpha:1, emis:0.85, wrap:1, rim:0}, part:{}});
  const sh = disc(0.52, 40, 0.004);
  scene.stage.push({mesh:new Mesh(sh), node:'world', shadow:true,
    mat:{color:[0,0,0], tex:shadowTex.tex, repeat:[1,1], sh:1, sp:0, alpha:0.62, emis:1, wrap:1, rim:0}, part:{}});
}

/* ── camera ───────────────────────────────────────────────────────── */
const drawerEl = document.getElementById('drawer');
const cam = {theta:0, phi:0.06, dist:3.4, target:[0,0.95,0], eye:[0,0,0]};
let autoSpin = true, spinVel = 0;
/* stations pull the camera to what you're editing */
const camGoal = {on:false, dist:3.4, ty:0.95, phi:0.06, theta:null};
function focusOn(mode){
  if(mode==='face'){ camGoal.dist=0.80; camGoal.ty=1.60; camGoal.phi=0.03; camGoal.theta=0; autoSpin=false; }
  else if(mode==='hair'){ camGoal.dist=1.20; camGoal.ty=1.56; camGoal.phi=0.10; camGoal.theta=0.55; autoSpin=false; }
  else if(mode==='feet'){ camGoal.dist=1.35; camGoal.ty=0.30; camGoal.phi=0.16; camGoal.theta=null; }
  else { camGoal.dist=3.4; camGoal.ty=0.95; camGoal.phi=0.06; camGoal.theta=null; }
  camGoal.on=true;
}
function easeCamera(dt){
  if(!camGoal.on || runway.on) return;
  const k=Math.min(1,dt*3.4);
  cam.dist  += (camGoal.dist-cam.dist)*k;
  cam.target[1] += (camGoal.ty-cam.target[1])*k;
  cam.phi   += (camGoal.phi-cam.phi)*k;
  if(camGoal.theta!==null){
    let d=camGoal.theta-cam.theta;
    d=Math.atan2(Math.sin(d),Math.cos(d));
    cam.theta += d*k;
  }
  if(Math.abs(camGoal.dist-cam.dist)<0.005 && Math.abs(camGoal.ty-cam.target[1])<0.004) camGoal.on=false;
}

/* The rail and drawer cover the right edge; shift the lens so the model
   stays centred in the space you can actually see. */
let lensShift = 0, lensTarget = 0;
function updateLens(){
  const W = canvas.clientWidth || 1;
  const railW = document.getElementById('rail').offsetWidth;
  const drW = drawerEl && !drawerEl.classList.contains('hidden') ? drawerEl.offsetWidth : 0;
  const occ = railW + drW;
  lensTarget = (occ < W*0.62) ? occ/W : 0;
}
function camMatrices(w,h){
  const cp=Math.cos(cam.phi), sp=Math.sin(cam.phi);
  cam.eye = [
    cam.target[0] + Math.sin(cam.theta)*cp*cam.dist,
    cam.target[1] + sp*cam.dist,
    cam.target[2] + Math.cos(cam.theta)*cp*cam.dist
  ];
  const proj = M4.persp(0.62, w/h, 0.05, 40);
  proj[8] = lensShift;
  return { proj, view: M4.lookAt(cam.eye, cam.target, [0,1,0]) };
}

/* pointer orbit */
(function(){
  let drag=false, lx=0, ly=0, pinch=0;
  const el=canvas;
  const down=(x,y)=>{ drag=true; lx=x; ly=y; camGoal.on=false; };
  const move=(x,y)=>{
    if(!drag) return;
    const dx=(x-lx)/innerWidth, dy=(y-ly)/innerHeight;
    cam.theta -= dx*4.2; spinVel = -dx*4.2;
    cam.phi = clamp(cam.phi + dy*2.6, -0.42, 0.85);
    lx=x; ly=y;
  };
  const up=()=>{ drag=false; };
  el.addEventListener('pointerdown', e=>{ el.setPointerCapture(e.pointerId); down(e.clientX,e.clientY); });
  el.addEventListener('pointermove', e=>move(e.clientX,e.clientY));
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e=>{
    e.preventDefault(); camGoal.on=false;
    cam.dist = clamp(cam.dist + e.deltaY*0.0022, 1.1, 7.5);
  }, {passive:false});
  el.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(e.touches.length===2 && pinch){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      cam.dist = clamp(cam.dist * (pinch/d), 1.1, 7.5);
      pinch=d;
    }
  }, {passive:true});
  el.addEventListener('touchend', ()=>{ pinch=0; });
})();

/* ── render ───────────────────────────────────────────────────────── */
const IDENT = M4.ident();
function adjMatrix(w){
  if(!w) return null;
  const a=w.adj;
  if(a.ox===0&&a.oy===0&&a.oz===0&&a.sx===1&&a.sy===1&&a.sz===1&&a.ry===0) return null;
  return M4.compose(a.ox,a.oy,a.oz, 0,a.ry,0, a.sx,a.sy,a.sz);
}
let rimCol=[0,0,0];
function setMat(m){
  const rk = m.rim!==undefined? m.rim : 1;
  gl.uniform3f(U.uRim, rimCol[0]*rk, rimCol[1]*rk, rimCol[2]*rk);
  gl.uniform3fv(U.uColor, m.color);
  gl.uniform1f(U.uUseTex, m.tex?1:0);
  gl.uniform2fv(U.uRepeat, m.repeat);
  gl.uniform1f(U.uShine, m.sh);
  gl.uniform1f(U.uSpec, m.sp);
  gl.uniform1f(U.uAlpha, m.alpha);
  gl.uniform1f(U.uEmis, m.emis);
  gl.uniform1f(U.uWrap, m.wrap);
  if(m.tex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, m.tex); gl.uniform1i(U.uTex, 0); }
}
function drawObj(o){
  const model = o.node==='world' ? IDENT : (()=>{
    const nw = rig.nodes[o.node].world;
    const a = adjMatrix(o.worn);
    return a? M4.mul(nw, a) : nw;
  })();
  gl.uniformMatrix4fv(U.uModel, false, model);
  gl.uniformMatrix3fv(U.uNMat, false, M4.normalMat(model));
  setMat(o.mat);
  o.mesh.draw();
}

let runwayMix = 0;   // 0 studio · 1 runway lighting
function setLights(){
  const B = BACKDROPS[bgKey];
  const key = hex2rgb(B.key), fill = hex2rgb(B.fill), rim = hex2rgb(B.rim);
  const k = 1 + runwayMix*0.30;
  const nrm=(v)=>{ const L=Math.hypot(v[0],v[1],v[2]); return [v[0]/L,v[1]/L,v[2]/L]; };
  const grey=(c,t)=>{ const l=c[0]*0.3+c[1]*0.6+c[2]*0.1; return c.map(v=>lerp(v,l,t)); };
  gl.uniform3fv(U.uKeyDir, nrm([0.42,0.62,0.72]));
  gl.uniform3fv(U.uKeyCol, key.map(v=>v*0.98*k));
  gl.uniform3fv(U.uFillDir, nrm([-0.78,0.16,0.46]));
  gl.uniform3fv(U.uFillCol, fill.map(v=>v*0.20));
  gl.uniform3fv(U.uBackDir, nrm([-0.24,0.40,-0.90]));
  gl.uniform3fv(U.uBackCol, rim.map(v=>v*(0.24+runwayMix*0.40)));
  gl.uniform3fv(U.uAmbTop, grey(hex2rgb(B.top),0.35).map(v=>v*0.30));
  gl.uniform3fv(U.uAmbBot, grey(hex2rgb(B.bot),0.35).map(v=>v*0.34));
  rimCol = rim.map(v=>v*(0.05+runwayMix*0.14));
}

function render(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.floor(canvas.clientWidth*dpr), h = Math.floor(canvas.clientHeight*dpr);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  gl.viewport(0,0,w,h);
  const B = BACKDROPS[bgKey], bc = hex2rgb(B.bot);
  gl.clearColor(bc[0],bc[1],bc[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const {proj,view} = camMatrices(w,h);
  gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniformMatrix4fv(U.uView,false,view);
  gl.uniform3fv(U.uCam, cam.eye);
  setLights();

  const opaque=[], trans=[];
  const push=list=>{ for(const o of list){ (o.mat.alpha<1||o.shadow? trans:opaque).push(o); } };
  push(scene.stage); push(scene.body); push(scene.hair);
  for(const s of SLOTS) push(scene.slot[s]);

  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  for(const o of opaque) drawObj(o);

  gl.enable(gl.BLEND); gl.depthMask(false);
  trans.sort((a,b)=>{
    const ay = a.node==='world'?0:rig.nodes[a.node].world[13];
    const by = b.node==='world'?0:rig.nodes[b.node].world[13];
    return ay-by;
  });
  for(const o of trans) drawObj(o);
  gl.depthMask(true); gl.disable(gl.BLEND);
}

/* ── poses & animation ────────────────────────────────────────────── */
const POSES = {
  stand: {name:'Relaxed', pose:{}},
  model: {name:'Hand on Hip', pose:{
    hips:[0,0.10,0.05], spine:[0,-0.05,-0.03], head:[0,0.14,0.02],
    armL:[0,0,0.62], foreL:[-0.35,0,-1.28], handL:[0,0,-0.3],
    armR:[0,0,-0.10], foreR:[0.10,0,0.05],
    legL:[0,0,0.10], legR:[-0.04,0,-0.02], footR:[0.14,0,0]
  }},
  sassy: {name:'Both Hips', pose:{
    hips:[0,-0.08,-0.04], spine:[0,0.06,0.02], head:[0.04,-0.10,-0.03],
    armL:[0,0,0.66], foreL:[-0.32,0,-1.34],
    armR:[0,0,-0.66], foreR:[-0.32,0,1.34],
    legL:[0,0,0.05], legR:[0,0,-0.05]
  }},
  wave: {name:'Wave', pose:{
    hips:[0,0.06,0], head:[0,-0.12,-0.05],
    armL:[0,0,2.05], foreL:[0,0,0.5],
    armR:[0,0,-0.18],
    legL:[0,0,0.04]
  }},
  power: {name:'Power Pose', pose:{
    spine:[-0.04,0,0], head:[-0.05,0,0],
    armL:[0,0,0.42], foreL:[-0.5,0,-0.5],
    armR:[0,0,-0.42], foreR:[-0.5,0,0.5],
    legL:[0,0,0.12], legR:[0,0,-0.12]
  }},
  twirl: {name:'Twirl', pose:{
    hips:[0,0.3,0], spine:[0,0.2,0.06], head:[0,0.2,0.05],
    armL:[0,0,1.35], foreL:[0,0,0.30],
    armR:[0,0,-1.05], foreR:[0,0,-0.25],
    legR:[-0.25,0,0], shinR:[0.5,0,0]
  }}
};
const POSE_IDS = Object.keys(POSES);

const anim = {t:0, poseBlend:{}, walk:0, walkAmt:0};
for(const k of NODE_ORDER) anim.poseBlend[k]=[0,0,0];

function animate(dt){
  anim.t += dt;
  const T = anim.t;
  const target = POSES[S.pose].pose;
  /* ease toward the chosen pose */
  for(const k of NODE_ORDER){
    const want = target[k] || [0,0,0];
    const cur = anim.poseBlend[k];
    for(let i=0;i<3;i++) cur[i] += (want[i]-cur[i]) * Math.min(1, dt*7);
  }
  const N = rig.nodes;
  for(const k of NODE_ORDER){
    const c=anim.poseBlend[k];
    N[k].rot[0]=c[0]; N[k].rot[1]=c[1]; N[k].rot[2]=c[2];
  }
  /* idle life */
  const breath = Math.sin(T*1.5);
  N.spine.rot[0] += breath*0.012;
  N.spine.scale[1] = 1 + breath*0.006;
  N.head.rot[1] += Math.sin(T*0.62)*0.05;
  N.head.rot[0] += Math.sin(T*0.9+1)*0.022;
  N.hips.rot[1] += Math.sin(T*0.5)*0.022;
  N.armL.rot[2] += Math.sin(T*0.7)*0.018;
  N.armR.rot[2] -= Math.sin(T*0.7+0.6)*0.018;

  /* runway walk */
  if(anim.walkAmt>0.001){
    const a = anim.walkAmt;
    anim.walk += dt*4.6;
    const p = anim.walk, s1=Math.sin(p), s2=Math.sin(p+Math.PI);
    N.legL.rot[0] += s1*0.52*a;
    N.legR.rot[0] += s2*0.52*a;
    N.shinL.rot[0] += Math.max(0,-s1)*0.75*a;
    N.shinR.rot[0] += Math.max(0,-s2)*0.75*a;
    N.footL.rot[0] += Math.max(0,s1)*0.28*a;
    N.footR.rot[0] += Math.max(0,s2)*0.28*a;
    N.armL.rot[0] += s2*0.42*a;
    N.armR.rot[0] += s1*0.42*a;
    N.hips.rot[1] += s1*0.13*a;
    N.hips.rot[2] += Math.sin(p*2)*0.03*a;
    N.spine.rot[1] -= s1*0.07*a;
    N.root.p[1] = (S.worn.shoes && itemById(S.worn.shoes.id).lift ? itemById(S.worn.shoes.id).lift.h : 0)
                  + Math.abs(Math.sin(p))*0.018*a;
  }
  easeCamera(dt);
  lensShift += (lensTarget-lensShift)*Math.min(1,dt*4);
  if(autoSpin && anim.walkAmt<0.5){
    cam.theta += dt*0.28;
  } else if(Math.abs(spinVel)>0.0005){
    cam.theta += spinVel*dt*2.4;
    spinVel *= 0.92;
  }
  rig.update();
}

const THEMES = [
  {name:'Y2K Mall Icon', hint:'Low-rise everything, butterfly clips, lip gloss.', tags:['y2k','party','cute','streetwear','retro']},
  {name:'Met Gala Debut', hint:'Big drama. Bigger silhouette. No casual anything.', tags:['gala','glam','elegant','luxe','princess']},
  {name:'Fairy of the Glade', hint:'Tulle, wings, something that catches the light.', tags:['fairy','fantasy','angel','cottage','princess']},
  {name:'Streetwear Drop', hint:'Layers, chunky soles, attitude.', tags:['streetwear','casual','edgy','sporty','athleisure']},
  {name:'Old Money Brunch', hint:'Quiet luxury. Nothing shouts.', tags:['office','elegant','clean','preppy','luxe','minimal']},
  {name:'Warehouse Rave', hint:'Neon, mesh, and something that glows.', tags:['rave','edgy','party','futuristic','y2k']},
  {name:'Cottage Picnic', hint:'Florals, soft light, a basket of pastries.', tags:['cottage','romantic','summer','cute','boho']},
  {name:'Goth Prom Night', hint:'Black lace, dark lip, one silver detail.', tags:['gothic','edgy','glam','party','romantic']},
  {name:'Office Siren', hint:'Sharp tailoring with one dangerous choice.', tags:['office','elegant','clean','glam','retro']},
  {name:'Winter Gala', hint:'Fur, frost tones, and long sleeves.', tags:['winter','luxe','gala','elegant','cozy']},
  {name:'Ballet Rehearsal', hint:'Soft pinks, wrapped legs, hair up.', tags:['ballet','cute','coquette','clean','romantic']},
  {name:'Western Rodeo', hint:'Denim, boots, and a hat that means it.', tags:['western','retro','casual','party']}
];
let theme = THEMES[0];

function judge(){
  const worn = SLOTS.map(s=>S.worn[s]).filter(Boolean).map(w=>({w, item:itemById(w.id)})).filter(x=>x.item);
  const notes=[];
  let score=0;

  /* theme fit */
  let hits=0, considered=0;
  for(const {item} of worn){
    considered++;
    const m = item.tags.filter(t=>theme.tags.includes(t)).length;
    if(m) hits += Math.min(m,2);
  }
  const themeScore = Math.min(46, hits*8);
  score += themeScore;
  if(themeScore>=32) notes.push(['good','Nailed the brief']);
  else if(themeScore>=16) notes.push(['good','On theme']);
  else notes.push(['bad','Off theme']);

  /* covered & complete */
  const hasDress = !!S.worn.dress;
  const hasTop = !!S.worn.top, hasBottom = !!S.worn.bottom;
  if(hasDress || (hasTop && hasBottom)) score += 18;
  else { notes.push(['bad', hasDress?'':'Half-dressed']); score += 4; }
  if(S.worn.shoes) score += 9; else notes.push(['bad','No shoes']);

  /* styling extras */
  const extras = ['head','eyes','ears','neck','back','hands','legwear','outer'].filter(s=>S.worn[s]).length;
  score += Math.min(14, extras*4);
  if(extras>=3) notes.push(['good','Accessorised']);
  else if(extras===0) notes.push(['bad','No accessories']);

  /* glam: makeup + hair */
  const mk=S.makeup;
  let glam=0;
  if(mk.lip!=='none') glam+=2;
  if(mk.shadow!=='none') glam+=2;
  if(mk.liner!=='none') glam+=2;
  if(mk.blush!=='none') glam+=1;
  if(mk.gem!=='none') glam+=1;
  if(S.hair.style!=='slick') glam+=1;
  score += glam;
  if(glam>=7) notes.push(['good','Beat is beating']);
  else if(glam<=2) notes.push(['bad','Bare face']);

  /* colour story */
  const hues = worn.map(({w})=>hex2hsl(w.color)).filter(h=>h[1]>0.12).map(h=>h[0]);
  let harmony=0;
  if(hues.length<2) harmony=6;
  else {
    let spread=0;
    for(const h of hues){
      let d=Math.abs(h-hues[0]); d=Math.min(d,360-d);
      spread=Math.max(spread,d);
    }
    if(spread<45){ harmony=10; notes.push(['good','Tonal palette']); }
    else if(spread>150 && spread<210){ harmony=10; notes.push(['good','Complementary colours']); }
    else if(spread<95){ harmony=7; }
    else { harmony=3; notes.push(['bad','Colours are fighting']); }
  }
  score += harmony;

  /* one pattern is styling; four is noise */
  const pats = worn.filter(({w})=>w.pattern!=='none').length;
  if(pats===1||pats===2){ score+=4; notes.push(['good','Pattern play']); }
  else if(pats>=4){ score-=6; notes.push(['bad','Too many patterns']); }

  score = clamp(Math.round(score),0,100);
  const title = score>=92? 'ICONIC' : score>=80? 'SERVING' : score>=66? 'CUTE FIT'
              : score>=50? 'NOT BAD' : score>=32? 'NEEDS WORK' : 'GO CHANGE';
  return {score, title, notes:notes.slice(0,6)};
}

/* ── save / load ──────────────────────────────────────────────────── */
const LS_FITS='runway.fits.v1', LS_LAST='runway.last.v1';
function serialize(){
  const worn={};
  for(const s of SLOTS){
    const w=S.worn[s];
    worn[s] = w? {id:w.id, color:w.color, color2:w.color2, pattern:w.pattern,
                  patScale:w.patScale, adj:Object.assign({},w.adj)} : null;
  }
  return JSON.stringify({
    skin:S.skin, glow:S.glow, body:S.body, hair:S.hair,
    makeup:S.makeup, worn, pose:S.pose, bg:bgKey
  });
}
function deserialize(json){
  let d; try{ d=JSON.parse(json); }catch(e){ return false; }
  if(!d) return false;
  S.skin = d.skin || S.skin;
  S.glow = d.glow!==undefined? d.glow : S.glow;
  Object.assign(S.body, d.body||{});
  Object.assign(S.hair, d.hair||{});
  Object.assign(S.makeup, d.makeup||{});
  S.pose = POSES[d.pose]? d.pose : 'stand';
  if(d.bg && BACKDROPS[d.bg]) bgKey = d.bg;
  for(const s of SLOTS){
    const cur=S.worn[s];
    if(cur && cur.tex) cur.tex.dispose();
    S.worn[s]=null;
    const w = d.worn && d.worn[s];
    if(w && itemById(w.id)){
      S.worn[s] = {id:w.id, color:w.color, color2:w.color2, pattern:w.pattern||'none',
                   patScale:w.patScale||3, adj:Object.assign({sx:1,sy:1,sz:1,ox:0,oy:0,oz:0,ry:0}, w.adj||{}),
                   tex:null};
    }
  }
  refreshFace(); refreshHair(); paintStage();
  for(const s of SLOTS) refreshPattern(s);
  rebuildAll();
  return true;
}
function savedFits(){
  try{ return JSON.parse(localStorage.getItem(LS_FITS)||'[]'); }catch(e){ return []; }
}
function saveFit(){
  const fits = savedFits();
  fits.unshift({name:theme.name, at:Date.now(), data:serialize()});
  try{ localStorage.setItem(LS_FITS, JSON.stringify(fits.slice(0,12))); }catch(e){}
  toast('Fit saved to your closet');
  if(S.station==='studio') openStation('studio');
}
function autosave(){
  try{ localStorage.setItem(LS_LAST, serialize()); }catch(e){}
}

/* pattern thumbnails, cached */
const patCache = new Map();
function patternThumb(id, c1, c2){
  const key=id+c1+c2;
  if(patCache.has(key)) return patCache.get(key);
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  drawPattern(cv.getContext('2d'), 64, id, c1, c2);
  const url=cv.toDataURL();
  if(patCache.size>200) patCache.clear();
  patCache.set(key,url);
  return url;
}

function itemCard(it, on, slot){
  return `<button class="item${on?' on':''}" data-act="equip" data-slot="${slot}" data-id="${it.id}"
    title="${esc(it.name)}"><span class="g">${it.emoji}</span><span class="n">${esc(it.name)}</span></button>`;
}
function itemGrid(cat, slot){
  const list = ITEMS.filter(i=>i.cat===cat);

  return `<div class="items">${list.map(i=>itemCard(i, cur&&cur.id===i.id, slot)).join('')}</div>`;
}
function swatches(colors, active, act, data={}){
  const attrs = Object.entries(data).map(([k,v])=>`data-${k}="${v}"`).join(' ');
  return `<div class="swatches">${colors.map(c=>
    `<button class="sw${c.toLowerCase()===String(active).toLowerCase()?' on':''}" style="background:${c}"
      data-act="${act}" ${attrs} data-hex="${c}" aria-label="${c}"></button>`).join('')}</div>`;
}
function slider(label, act, key, min, max, step, val, fmt){
  const v = fmt? fmt(val) : val.toFixed(2);
  return `<div class="row"><label>${label}</label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}"
      data-act="${act}" data-key="${key}">
    <span class="val" data-val="${act}:${key}">${v}</span></div>`;
}
function chooser(list, active, act, key){
  return `<div class="tabs">${list.map(o=>
    `<button class="tab${o.id===active?' on':''}" data-act="${act}" data-key="${key}" data-val="${o.id}">${esc(o.name)}</button>`

    else h += `<div class="items">${fits.map((f,i)=>
      `<button class="item wide" data-act="loadfit" data-i="${i}">
        <span class="g">🧷</span><span class="n">${esc(f.name)}<br>${new Date(f.at).toLocaleDateString()}</span>
      </button>`).join('')}</div>`;
    h += `<div class="btnrow" style="margin-top:10px">
      <button class="btn" data-act="savefit">Save fit</button>
      <button class="btn" data-act="clearfits">Clear closet</button></div>`;
    h += H('Everything Else');
    h += `<div class="btnrow">
      <button class="btn" data-act="random">Surprise me</button>
      <button class="btn" data-act="strip">Undress</button>
      <button class="btn" data-act="photo">Save photo</button></div>`;
  }

  else {                       // a clothing slot station
    h += itemGrid(st, st);
    h += dressPanel(st);
  }

  dbody.innerHTML = h;
  dbody.scrollTop = 0;
  for(const b of rail.children) b.classList.toggle('on', b.dataset.id===st);
}

function setDrawer(open){
  drawer.classList.toggle('hidden', !open);
  document.body.classList.toggle('drawer-open', open);
  updateLens();
}
const STATION_FOCUS = {face:'face', hair:'hair', shoes:'feet', legwear:'feet'};
function openStation(id){
  S.station=id;
  setDrawer(true);
  renderPanel();
  focusOn(STATION_FOCUS[id] || 'body');
}

/* build the rail */
rail.innerHTML = STATIONS.map(s=>
  `<button class="station" data-id="${s.id}" title="${s.title}">
    <span class="ico">${s.ico}</span><span class="lbl">${s.label}</span></button>`).join('');
rail.addEventListener('click', e=>{
  const b=e.target.closest('.station'); if(!b) return;
  if(S.station===b.dataset.id && !drawer.classList.contains('hidden')){
    setDrawer(false);
    b.classList.remove('on');
  } else openStation(b.dataset.id);
});
$('#dclose').addEventListener('click', ()=>setDrawer(false));

/* rebuilds are batched to one per frame */
let needRebuild=false, needPanel=false;
function queueRebuild(){ needRebuild=true; }
function queuePanel(){ needPanel=true; }

/* ── panel events ─────────────────────────────────────────────────── */
dbody.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.tagName==='INPUT') return;
  const d = b.dataset, act = d.act;
  switch(act){
    case 'equip': equip(d.slot, d.id); queuePanel(); autosave(); break;
    case 'unequip': clearSlot(d.slot); queuePanel(); autosave(); break;
    case 'color': {
      const w=S.worn[d.slot]; if(!w) break;
      if(d.which==='1') w.color=d.hex; else w.color2=d.hex;
      refreshPattern(d.slot); recolorSlot(d.slot); queuePanel(); autosave(); break;
    }
    case 'swapcolor': {
      const w=S.worn[d.slot]; if(!w) break;
      const t=w.color; w.color=w.color2; w.color2=t;
      refreshPattern(d.slot); recolorSlot(d.slot); queuePanel(); autosave(); break;
    }
    case 'pattern': {
      const w=S.worn[d.slot]; if(!w) break;
      w.pattern=d.pat; refreshPattern(d.slot); recolorSlot(d.slot); queuePanel(); autosave(); break;
    }
    case 'resetfit': {
      const w=S.worn[d.slot]; if(!w) break;
      w.adj={sx:1,sy:1,sz:1,ox:0,oy:0,oz:0,ry:0}; queuePanel(); autosave(); break;
    }
    case 'skin': S.skin=d.hex; refreshFace(); recolorBody(); queuePanel(); autosave(); break;
    case 'bodyshape': {
      const P={hourglass:{bust:1.0,waist:0.86,hip:1.0,shoulder:1.0},
               slim:{bust:0.82,waist:0.80,hip:0.86,shoulder:0.94},
               curvy:{bust:1.24,waist:0.90,hip:1.18,shoulder:1.0},
               athletic:{bust:0.88,waist:0.95,hip:0.94,shoulder:1.14},
               plus:{bust:1.28,waist:1.24,hip:1.22,shoulder:1.06},
               pear:{bust:0.9,waist:0.88,hip:1.26,shoulder:0.92}}[d.val];
      Object.assign(S.body, P, {shape:d.val});
      queueRebuild(); queuePanel(); autosave(); break;
    }
    case 'mk': S.makeup[d.key]=d.val; refreshFace(); queuePanel(); autosave(); break;
    case 'mkcolor': S.makeup[d.key]=d.hex; refreshFace(); queuePanel(); autosave(); break;
    case 'hairstyle': S.hair.style=d.id; buildHairObjs(); queuePanel(); autosave(); break;
    case 'bangs': S.hair.bangs=d.id; buildHairObjs(); queuePanel(); autosave(); break;
    case 'haircolor':
      S.hair[d.which]=d.hex;
      if(d.which==='root' && S.hair.tip===S.hair.root) S.hair.tip=d.hex;
      refreshHair(); queuePanel(); autosave(); break;
    case 'hairmatch': S.hair.tip=S.hair.root; refreshHair(); queuePanel(); autosave(); break;
    case 'facetab': ui.face=d.val; renderPanel(); break;
    case 'acctab': ui.acc=d.val; renderPanel(); break;
    case 'pose': S.pose=d.val; queuePanel(); autosave(); break;
    case 'bg': bgKey=d.val; paintStage(); queuePanel(); autosave(); break;
    case 'reroll': rerollTheme(); queuePanel(); break;
    case 'runway': startRunway(); break;
    case 'savefit': saveFit(); queuePanel(); break;
    case 'loadfit': {
      const f=savedFits()[+d.i];
      if(f && deserialize(f.data)){ toast('Fit loaded'); queuePanel(); }
      break;
    }
    case 'clearfits': localStorage.removeItem(LS_FITS); toast('Closet cleared'); queuePanel(); break;
    case 'random': randomize(); queuePanel(); break;
    case 'strip': undress(); queuePanel(); break;
    case 'photo': savePhoto(); break;
  }
});

dbody.addEventListener('input', e=>{
  const t=e.target;
  if(t.type==='range'){
    const {act,key}=t.dataset, v=parseFloat(t.value);
    const lbl=dbody.querySelector(`[data-val="${act}:${key}"]`);
    if(lbl) lbl.textContent = v.toFixed(2);
    switch(act){
      case 'body': S.body[key]=v; queueRebuild(); break;
      case 'num': S[key]=v; if(key==='glow') recolorBody(); break;
      case 'mknum': S.makeup[key]=v; refreshFace(); break;
      case 'hairnum': S.hair[key]=v; refreshHair(); break;
      case 'pat': {
        const w=S.worn[curSlot()]; if(w){ w.patScale=v; recolorSlot(curSlot()); }
        break;
      }
      case 'adj': {
        const w=S.worn[curSlot()]; if(w) w.adj[key]=v;
        break;
      }
    }
    autosaveSoon();
  } else if(t.type==='color'){
    const {act,which,slot,key}=t.dataset;
    if(act==='colorpick'){
      const w=S.worn[slot]; if(!w) return;
      if(which==='1') w.color=t.value; else w.color2=t.value;
      refreshPattern(slot); recolorSlot(slot);
    } else if(act==='skinpick'){ S.skin=t.value; refreshFace(); recolorBody(); }
    else if(act==='hairpick'){ S.hair[which]=t.value; refreshHair(); }
    else if(act==='mkpick'){ S.makeup[key]=t.value; refreshFace(); }
    autosaveSoon();
  }
});
function curSlot(){ return S.station==='acc'? ui.acc : S.station; }
function recolorSlot(slot){
  const w=S.worn[slot]; if(!w) return;
  const it=itemById(w.id);
  for(const o of scene.slot[slot]) o.mat = matFor(o.part, w, it);
}
function recolorBody(){
  for(const o of scene.body){
    o.mat.color = hex2rgb(S.skin);
    o.mat.sp = 0.14 + S.glow*0.22;
  }
}
let autosaveTimer;
function autosaveSoon(){ clearTimeout(autosaveTimer); autosaveTimer=setTimeout(autosave, 400); }

/* ── dock actions ─────────────────────────────────────────────────── */
function rerollTheme(){
  let t; do { t = THEMES[Math.floor(Math.random()*THEMES.length)]; } while(t===theme && THEMES.length>1);
  theme=t;
  $('#theme-name').textContent=theme.name;
  $('#theme-hint').textContent=theme.hint;
  $('#rw-theme').textContent=theme.name;
}
function undress(){
  for(const s of SLOTS) clearSlot(s);
  toast('Everything off');
  autosave();
}
function randomize(){
  RNG_SEED = (Math.random()*1e9)|0;
  S.skin = pick(SKIN_TONES);
  S.hair.style = pick(HAIRSTYLES).id;
  S.hair.bangs = pick(BANGS).id;
  S.hair.root = pick(HAIR_COLORS);
  S.hair.tip = rnd()>0.65? pick(HAIR_COLORS) : S.hair.root;
  const mk=S.makeup;
  mk.lip = pick(['natural','glossy','matte','ombre','overlined','dark']);
  mk.lipColor = pick(LIP_COLORS);
  mk.shadow = pick(['none','soft','smoky','cutcrease','halo','graphic']);
  mk.shadowColor = pick(GARMENT_COLORS);
  mk.liner = pick(['none','thin','winged','graphic','smudge']);
  mk.blush = pick(['none','soft','high','doll','sunkissed']);
  mk.lash = pick(['natural','doll','dramatic']);
  mk.eyeColor = pick(EYE_COLORS);
  mk.gem = rnd()>0.7? pick(['star','heart','tear','constellation']) : 'none';
  mk.highlight = rnd();
  /* dress to the theme: prefer items sharing a tag with tonight's brief */
  const onTheme = cat=>{
    const all = ITEMS.filter(i=>i.cat===cat);
    const good = all.filter(i=>i.tags.some(t=>theme.tags.includes(t)));
    return (good.length && rnd()<0.78)? pick(good) : (all.length? pick(all):null);
  };
  for(const s of SLOTS) clearSlot(s);
  const palette = [pick(GARMENT_COLORS), pick(GARMENT_COLORS)];
  const wearIt = (slot)=>{
    const it = onTheme(slot); if(!it) return;
    equip(slot, it.id);
    const w=S.worn[slot];
    if(rnd()>0.45) w.color = rnd()>0.5? palette[0] : palette[1];
    if(rnd()>0.72) w.pattern = pick(PATTERN_IDS);
    w.color2 = shade(w.color, rnd()>0.5? 0.35 : -0.42);
    refreshPattern(slot); recolorSlot(slot);
  };
  if(rnd()>0.45){ wearIt('dress'); }
  else { wearIt('top'); wearIt('bottom'); }
  wearIt('shoes');
  if(rnd()>0.5) wearIt('outer');
  if(rnd()>0.55) wearIt('legwear');
  for(const s of ['head','eyes','ears','neck','back','hands']) if(rnd()>0.55) wearIt(s);
  refreshFace(); refreshHair(); rebuildAll(); autosave();
  toast('Fresh look');
}
function savePhoto(){
  const keep = lensShift; lensShift = 0;   // photos are centred
  render();
  lensShift = keep;
  canvas.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='runway-'+Date.now()+'.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  });
  toast('Photo saved');
}

$('#btn-spin').addEventListener('click', ()=>{ autoSpin=!autoSpin; toast(autoSpin?'Turntable on':'Turntable off'); });
$('#btn-pose').addEventListener('click', ()=>{
  const i=POSE_IDS.indexOf(S.pose);
  S.pose=POSE_IDS[(i+1)%POSE_IDS.length];
  toast(POSES[S.pose].name); queuePanel(); autosave();
});
$('#btn-random').addEventListener('click', ()=>{ randomize(); queuePanel(); });
$('#btn-strip').addEventListener('click', ()=>{ undress(); queuePanel(); });
$('#btn-save').addEventListener('click', ()=>{ saveFit(); queuePanel(); });
$('#btn-shot').addEventListener('click', savePhoto);
$('#btn-runway').addEventListener('click', ()=>startRunway());
$('#theme-reroll').addEventListener('click', ()=>{ rerollTheme(); queuePanel(); });
$('#rw-exit').addEventListener('click', ()=>endRunway());

/* ── the walk ─────────────────────────────────────────────────────── */
const runway = {on:false, t:0, prev:null, result:null};
function startRunway(){
  if(runway.on) return;
  runway.on = true; runway.t = 0; runway.result = null;
  runway.prev = {pose:S.pose, spin:autoSpin, dist:cam.dist, phi:cam.phi, theta:cam.theta};
  autoSpin = false;
  S.pose = 'stand';
  setDrawer(false);
  $('#runway').classList.add('on');
  $('#rw-score').classList.remove('show');
  $('#rw-num').innerHTML = '0<small>/100</small>';
  $('#rw-notes').innerHTML = '';
  $('#rw-title').textContent = 'Judging…';
  $('#rw-theme').textContent = theme.name;
  document.body.classList.add('on-runway');
}
function endRunway(){
  runway.on = false;
  anim.walkAmt = 0;
  $('#runway').classList.remove('on');
  document.body.classList.remove('on-runway');
  if(runway.prev){
    S.pose = runway.prev.pose;
    autoSpin = runway.prev.spin;
    cam.dist = runway.prev.dist; cam.phi = runway.prev.phi;
    cam.target[1] = 0.95;
  }
}
function tickRunway(dt){
  if(!runway.on){
    runwayMix += (0-runwayMix)*Math.min(1,dt*3);
    return;
  }
  runway.t += dt;
  const t = runway.t;
  runwayMix += (1-runwayMix)*Math.min(1,dt*2.2);

  cam.target[1] = lerp(cam.target[1], 1.00, Math.min(1,dt*2));
  if(t<0.9){                                   // lights up, camera drops back
    cam.dist = lerp(cam.dist, 4.6, Math.min(1,dt*3));
    cam.phi  = lerp(cam.phi, -0.02, Math.min(1,dt*3));
    cam.theta= lerp(cam.theta, 0, Math.min(1,dt*3));
    anim.walkAmt = lerp(anim.walkAmt, 0, Math.min(1,dt*5));
  } else if(t<5.6){                            // the walk
    anim.walkAmt = lerp(anim.walkAmt, 1, Math.min(1,dt*2.5));
    cam.dist = lerp(cam.dist, 3.35, Math.min(1,dt*0.5));
    cam.phi  = lerp(cam.phi, 0.04, Math.min(1,dt*0.7));
    cam.theta = Math.sin(t*0.5)*0.26;
  } else if(t<7.6){                            // stop, hit the pose, turn
    anim.walkAmt = lerp(anim.walkAmt, 0, Math.min(1,dt*3));
    if(S.pose!=='model') S.pose='model';
    cam.theta = lerp(cam.theta, 0.5, Math.min(1,dt*1.1));
    cam.dist  = lerp(cam.dist, 3.0, Math.min(1,dt*1.2));
    cam.phi   = lerp(cam.phi, 0.07, Math.min(1,dt*1.2));
  } else {                                     // the verdict
    if(!runway.result){
      runway.result = judge();
      const r=runway.result;
      $('#rw-title').textContent = r.title;
      $('#rw-notes').innerHTML = r.notes.map(([k,txt])=>
        `<span class="${k}">${esc(txt)}</span>`).join('');
      $('#rw-score').classList.add('show');
      runway.countFrom = 0;
    }
    const r=runway.result;
    runway.countFrom = Math.min(r.score, runway.countFrom + dt*r.score*1.4);
    $('#rw-num').innerHTML = Math.round(runway.countFrom)+'<small>/100</small>';
    cam.dist = lerp(cam.dist, 3.5, Math.min(1,dt*1.5));
    cam.target[1] = lerp(cam.target[1], 1.05, Math.min(1,dt*2));
    cam.theta += dt*0.12;
  }
}

/* ── boot ─────────────────────────────────────────────────────────── */
addEventListener('resize', updateLens);
addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(runway.on) endRunway(); else setDrawer(false); }
  if(e.key===' ' && !e.repeat && e.target===document.body){ e.preventDefault(); autoSpin=!autoSpin; }
});

let last=performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last=now;
  if(needRebuild){ needRebuild=false; rebuildAll(); }
  if(needPanel){ needPanel=false; renderPanel(); }
  tickRunway(dt);
  animate(dt);
  render();
  requestAnimationFrame(frame);
}

function init(){
  updateLens();
  paintStage();
  buildStage();
  refreshFace();
  refreshHair();
  rebuildAll();
  rerollTheme();

  const last = (()=>{ try{ return localStorage.getItem(LS_LAST); }catch(e){ return null; } })();
  if(last && deserialize(last)){
    /* restored */
  } else {
    equip('top','crop-tee');
    equip('bottom','mini');
    equip('shoes','platform');
    equip('ears','hoops');
  }
  openStation('skin');
  requestAnimationFrame(frame);
  setTimeout(()=>$('#boot').classList.add('gone'), 260);
  setTimeout(()=>{ const b=$('#boot'); if(b&&b.parentNode) b.parentNode.removeChild(b); }, 1000);
}
init();
</script>
